name: One-time security lockfile refresh

on:
  push:
    branches:
      - security/production-hardening-2026-09-07
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve patched dependency graph
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit resolved production graph
        run: npm audit --omit=dev --audit-level=high
      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

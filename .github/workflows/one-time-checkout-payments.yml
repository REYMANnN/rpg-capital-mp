name: Apply checkout payments patch

on:
  push:
    branches: ['feat/checkout-payments-finance']
    paths:
      - '.github/workflows/one-time-checkout-payments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkout-payments-finance
          fetch-depth: 0
      - run: python scripts/patch_checkout_payments.py
      - run: |
          rm scripts/patch_checkout_payments.py .github/workflows/one-time-checkout-payments.yml
          git config user.name "balcao-checkout-bot"
          git config user.email "balcao-checkout-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: add checkout payment selector"
          git push origin feat/checkout-payments-finance

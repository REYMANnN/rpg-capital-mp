name: Measure Cloudflare Free Bundle

on:
  push:
    branches:
      - fix/cloudflare-opennext-dev

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-opennext-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Cloudflare Worker
        env:
          WORKERS_CI: '1'
        run: npm run build
      - name: Enforce Workers Free compressed size
        run: |
          npx wrangler deploy --dry-run 2>&1 | tee /tmp/wrangler-size.log
          SIZE=$(sed -n 's/.*gzip: \([0-9.]*\) KiB.*/\1/p' /tmp/wrangler-size.log | tail -1)
          echo "Compressed Worker size: ${SIZE} KiB"
          test -n "$SIZE"
          awk -v size="$SIZE" 'BEGIN { if (size >= 3072) { printf "Worker too large for Free plan: %.2f KiB\n", size; exit 1 } }'

name: One-time inventory v9 UI fix

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-time-inventory-v9-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Keep version visible on mobile
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/inventory-v1/inventory.module.css')
          text = path.read_text(encoding='utf-8')
          old = '@media(max-width:800px){.top{padding:0 16px}.status{display:none}'
          new = '@media(max-width:800px){.top{padding:0 16px}.status{display:flex;font-size:11px;opacity:.9}.status>span{display:none}'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('mobile status rule not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify mobile version rule
        shell: bash
        run: |
          grep -q '.status{display:flex;font-size:11px;opacity:.9}.status>span{display:none}' app/inventory-v1/inventory.module.css

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "inventory-v9-bot"
          git config user.email "inventory-v9-bot@users.noreply.github.com"
          git add app/inventory-v1/inventory.module.css
          git commit -m "fix: show inventory version on mobile" || exit 0
          git push origin master

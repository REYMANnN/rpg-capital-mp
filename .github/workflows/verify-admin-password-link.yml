name: Verify admin password and invite

on:
  push:
    branches:
      - verify-admin-password-link

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admin core tests
        run: node --experimental-strip-types --test tests/accounts/adminPanel.test.ts
      - name: Invite tests
        run: node --experimental-strip-types --test tests/invite-onboarding.test.ts
      - name: TypeScript lib/app gate
        shell: bash
        run: |
          set +e
          npx tsc --noEmit -p . 2>&1 | tee /tmp/tsc.log
          if grep -E '^(lib|app)/.*error TS' /tmp/tsc.log; then
            exit 1
          fi
          echo "No TypeScript errors in lib/ or app/"

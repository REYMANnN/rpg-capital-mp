name: BALCAO Accounts and Security CI

on:
  push:
    branches:
      - balcao-v10.6-accounts-impl
      - security/production-hardening-2026-09-07
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Repository tests
        run: npx tsx --test tests/accounts/*.test.ts tests/*.test.ts
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        run: npm run build

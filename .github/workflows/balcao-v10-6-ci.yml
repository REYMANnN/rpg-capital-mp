name: BALCAO v10.6 Accounts CI

on:
  push:
    branches: [balcao-v10.6-accounts-impl]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Accounts unit tests
        run: npx tsx --test tests/accounts/*.test.ts
      - name: Existing inventory tests
        run: npx tsx --test tests/nfeKey.test.ts tests/nfe.test.ts tests/purchaseMath.test.ts tests/productMatcher.test.ts tests/invoiceReview.test.ts tests/catalog*.test.ts tests/productLifecycle.test.ts
      - name: Production build
        run: npm run build

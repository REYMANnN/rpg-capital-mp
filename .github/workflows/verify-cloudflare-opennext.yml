name: Verify Cloudflare OpenNext port

on:
  push:
    branches:
      - fix/cloudflare-opennext-dev

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-opennext-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install supported Next, OpenNext and Wrangler
        run: |
          npm install next@16.3.3 eslint-config-next@16.3.3 @opennextjs/cloudflare@latest
          npm install --save-dev wrangler@latest
      - name: Build through the same command used by Cloudflare
        env:
          WORKERS_CI: '1'
        run: npm run build
      - name: Verify OpenNext worker output
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
      - name: Verify existing Cloudflare deploy command
        run: npx wrangler deploy --dry-run
      - name: Verify Next build on Cloudflare branch
        run: npm run build:next
      - name: Commit dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: align Cloudflare dev runtime dependencies"
          git push

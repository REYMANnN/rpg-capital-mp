name: Apply product search profile

on:
  push:
    branches: [feat/product-search-profile]
    paths:
      - scripts/apply-product-search-profile.mjs
      - .github/workflows/product-search-profile-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-search-profile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate patch script
        run: node --check scripts/apply-product-search-profile.mjs
      - name: Apply feature patch
        run: node scripts/apply-product-search-profile.mjs
      - name: Commit generated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add product search and item profile"
          git push origin HEAD:feat/product-search-profile

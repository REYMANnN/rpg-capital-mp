name: Verify Cloudflare Workers port

on:
  push:
    branches:
      - fix/cloudflare-workers-dev

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-workers-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Align React runtime and install vinext
        run: npm install react@19.2.6 react-dom@19.2.6 react-server-dom-webpack@19.2.6 vinext@latest @vinext/cloudflare@latest
      - name: Install Cloudflare/vinext build dependencies
        run: npm install --save-dev vite@latest @vitejs/plugin-react@latest @vitejs/plugin-rsc@latest @cloudflare/vite-plugin@latest wrangler@latest
      - name: Build for Cloudflare Workers
        env:
          WORKERS_CI: '1'
        run: npm run build
      - name: Verify generated Wrangler deployment config
        run: |
          test -f .wrangler/deploy/config.json
          cat .wrangler/deploy/config.json
      - name: Verify Wrangler deploy bundle
        run: npx wrangler deploy --dry-run
      - name: Verify Next.js/Vercel build still works
        run: npm run build:next
      - name: Commit synchronized dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency metadata already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add Cloudflare Workers build dependencies"
          git push

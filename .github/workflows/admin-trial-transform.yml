name: Admin Trial Integration Transform

on:
  push:
    branches: [feature/admin-trial-accounts]
    paths:
      - scripts/admin-trial-transform.mjs

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-trial-accounts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/admin-trial-transform.mjs
      - name: Commit transformed files
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rafa-agent.ts lib/rafa-brain.ts lib/whatsapp-inbound.ts
          git commit -m "feat: integrate trial Pix capture into Rafa [skip ci]"
          git push origin HEAD:feature/admin-trial-accounts

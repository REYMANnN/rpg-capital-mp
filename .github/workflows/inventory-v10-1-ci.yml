name: Inventory v10.x CI

on:
  push:
    branches: ['inventory-v10.1', 'inventory-v10.2', 'inventory-v10.3']
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Inventory v10.x tests
        run: npx tsx --test tests/nfeKey.test.ts tests/nfe.test.ts tests/intake.test.ts tests/productMatcher.test.ts tests/product-rules.test.ts tests/scanner-policy.test.ts tests/invoiceReview.test.ts tests/invoiceResolver.test.ts tests/supplierAliasContract.test.ts tests/v10_1ScenarioMatrix.test.ts tests/v10_2Ux.test.ts tests/productLifecycle.test.ts tests/v10_3DeleteProduct.test.ts
      - name: Production build
        run: npm run build


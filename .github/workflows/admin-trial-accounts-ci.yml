name: Admin Trial Accounts CI

on:
  push:
    branches: [feature/admin-trial-accounts]
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - name: Trial and Pix tests
        run: node --experimental-strip-types --test tests/admin-trial-accounts.test.ts tests/rafa-pix.test.ts
      - name: Existing WhatsApp tests
        run: npm run test:whatsapp
      - name: Feature lint
        run: npx eslint lib/admin/trial-accounts-core.ts lib/admin/trial-accounts.ts lib/rafa-pix-core.ts lib/rafa-pix.ts lib/whatsapp.ts app/api/admin/trial-accounts/route.ts app/admin/trial-accounts/page.tsx app/admin/trial-accounts/TrialAccountsClient.tsx app/admin/page.tsx
      - name: Build
        run: npm run build

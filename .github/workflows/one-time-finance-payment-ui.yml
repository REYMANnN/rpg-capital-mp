name: Apply finance payment UI patch

on:
  push:
    branches: ['feat/checkout-payments-finance']
    paths:
      - '.github/workflows/one-time-finance-payment-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/checkout-payments-finance
          fetch-depth: 0
      - run: python scripts/patch_finance_payment_ui.py
      - run: |
          rm scripts/patch_finance_payment_ui.py .github/workflows/one-time-finance-payment-ui.yml
          git config user.name "balcao-finance-ui-bot"
          git config user.email "balcao-finance-ui-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat: show checkout payment insights in finance"
          git push origin feat/checkout-payments-finance

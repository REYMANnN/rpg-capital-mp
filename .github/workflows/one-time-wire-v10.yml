name: Wire inventory v10

on:
  push:
    branches: [inventory-v10]
    paths:
      - '.github/workflows/one-time-wire-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventory-v10
          fetch-depth: 0
      - name: Wire v10 intake into inventory state
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('app/inventory-v1/InventoryV1.tsx')
          text = path.read_text(encoding='utf-8')
          if "import InvoiceIntakeV10 from './InvoiceIntakeV10'" not in text:
              text = text.replace("import QuaggaScanner from './QuaggaScanner'\n", "import QuaggaScanner from './QuaggaScanner'\nimport InvoiceIntakeV10 from './InvoiceIntakeV10'\nimport type { InvoiceReviewLineV10 } from '@/lib/inventory/invoiceReview'\n")
          old = """type Movement = {
  id: string
  productId: string
  type: 'initial' | 'purchase' | 'sale' | 'adjustment'
  quantityMilli: number
  createdAt: string
  note: string
}"""
          new = """type Movement = {
  id: string
  productId: string
  type: 'initial' | 'purchase' | 'sale' | 'adjustment'
  quantityMilli: number
  createdAt: string
  note: string
  supplierDocument?: string
  supplierName?: string
  invoiceKey?: string
  invoiceNumber?: string
}"""
          if old in text: text = text.replace(old, new, 1)
          if 'function confirmInvoiceV10(' not in text:
              anchor = "  async function handleCode(raw: string) {"
              fn = r'''  function confirmInvoiceV10(invoice: ParsedNfe, importable: InvoiceReviewLineV10[]) {
    if (!importable.length) return fail('Selecione ao menos um item identificado para importar.')
    const marker = invoiceMarker(invoice)
    if (data.movements.some((movement) => movement.type === 'purchase' && (movement.invoiceKey === invoice.accessKey || movement.note.includes(marker)))) return fail('Esta NF-e já foi importada.')
    setData((current) => {
      let products = current.products.map((product) => ({ ...product }))
      const movements = [...current.movements]
      const now = new Date().toISOString()
      for (const line of importable) {
        let product = products.find((candidate) => candidate.barcode === line.barcode)
        if (!product) {
          product = { id: uid(), barcode: line.barcode, name: line.name || line.description, unit: 'UN', priceCents: 0, stockMilli: 0, minStockMilli: 0, averageCostCents: 0, catalogSource: line.source || undefined, catalogBrand: line.brand || undefined, catalogImageUrl: line.imageUrl || undefined }
          products.push(product)
        }
        const update = calculatePurchaseUpdate(product.stockMilli, product.averageCostCents, line.quantityMilli, line.unitCostCents)
        products = products.map((candidate) => candidate.id === product!.id ? { ...candidate, ...update } : candidate)
        movements.push({ id: uid(), productId: product.id, type: 'purchase', quantityMilli: line.quantityMilli, createdAt: now, note: `${marker} · NF ${invoice.number || 's/n'} · ${invoice.supplierName || 'Fornecedor'}`, supplierDocument: invoice.supplierDocument || undefined, supplierName: invoice.supplierName || undefined, invoiceKey: invoice.accessKey || undefined, invoiceNumber: invoice.number || undefined })
      }
      return { ...current, products, movements }
    })
    flash(`${importable.length} item(ns) confirmados e adicionados ao estoque. Produtos novos ficaram com preço de venda pendente.`)
  }

'''
              if anchor not in text: raise SystemExit('handleCode anchor missing')
              text = text.replace(anchor, fn + anchor, 1)
          pattern = re.compile(r"\{tab === 'intake' && \(\n\s*<Intake[\s\S]*?\n\s*/>\n\s*\)\}", re.M)
          replacement = """{tab === 'intake' && (
          <InvoiceIntakeV10 products={data.products} onCommit={confirmInvoiceV10} fail={fail} flash={flash} />
        )}"""
          if '<InvoiceIntakeV10 products={data.products}' not in text:
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1: raise SystemExit(f'intake replacement count={count}')
          text = text.replace('Versão {INVENTORY_APP_VERSION}. Scan unitário para cadastro/edição e NF-e XML para entrada em massa.', 'Versão {INVENTORY_APP_VERSION}. Scan unitário para produtos e scan de chave NF-e com revisão inteligente para compras.')
          path.write_text(text, encoding='utf-8')
      - name: Verify wiring
        run: |
          grep -q "InvoiceIntakeV10" app/inventory-v1/InventoryV1.tsx
          grep -q "confirmInvoiceV10" app/inventory-v1/InventoryV1.tsx
          grep -q "invoiceKey?: string" app/inventory-v1/InventoryV1.tsx
      - name: Commit wiring
        run: |
          git config user.name "inventory-v10-bot"
          git config user.email "inventory-v10-bot@users.noreply.github.com"
          git add app/inventory-v1/InventoryV1.tsx
          git commit -m "feat: wire v10 invoice intake into inventory" || exit 0
          git push origin inventory-v10

# trigger: 3

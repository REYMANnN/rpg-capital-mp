name: Trigger BALCÃO v10.x production deploy

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-time-wire-v10.yml'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Emit real Git push for Vercel
        run: |
          git config user.name "inventory-v10-release-bot"
          git config user.email "inventory-v10-release-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: publish BALCÃO v10.3"
          git push origin master

name: Wire inventory v10

on:
  push:
    branches: [inventory-v10]
    paths:
      - '.github/workflows/one-time-wire-v10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventory-v10
          fetch-depth: 0
      - name: Apply final v10 UX fixes
        run: python scripts/finish_inventory_v10.py
      - name: Commit fixes
        run: |
          git config user.name "inventory-v10-bot"
          git config user.email "inventory-v10-bot@users.noreply.github.com"
          git add app/inventory-v1/InvoiceIntakeV10.tsx
          git commit -m "fix: finish v10 invoice review interactions" || exit 0
          git push origin inventory-v10

# trigger: 6
